name: Repository quality and secret scanning

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 1 * *'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check documentation, code syntax, secret patterns, and assets
        run: python tools/portfolio_audit.py

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out full Git history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git changes (full history on schedule/manual dispatch)
        uses: trufflesecurity/trufflehog@f15cb8b37b9b70056bc82a8eb7151f75fad27a71 # v3.90.13
        with:
          version: '3.90.13'
          extra_args: --only-verified
